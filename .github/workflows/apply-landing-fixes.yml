name: Apply landing security and QA fixes
on:
  push:
    branches: [fix/security-qa-landings]
permissions:
  contents: write
jobs:
  remediate:
    if: "!contains(github.event.head_commit.message, '[automated-remediation]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-qa-landings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_landing_fixes.py
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "fix: remediate landing security and QA findings [automated-remediation]"
            git push
          fi
